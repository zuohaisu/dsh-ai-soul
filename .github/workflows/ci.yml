name: CI

on:
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/evolution/**'
      - 'docs/decisions/**'
      - 'docs/knowledge/**'
      - 'docs/architecture/ai-native-mind.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/evolution/**'
      - 'docs/decisions/**'
      - 'docs/knowledge/**'
      - 'docs/architecture/ai-native-mind.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check
        run: npm run check
