name: CI

on:
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/evolution/**'
      - 'docs/decisions/**'
      - 'docs/knowledge/**'
      - 'docs/architecture/ai-native-mind.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/evolution/**'
      - 'docs/decisions/**'
      - 'docs/knowledge/**'
      - 'docs/architecture/ai-native-mind.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check
        id: check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log

      - name: Preserve check failure diagnostics
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: check-failure-${{ github.run_id }}
          path: check.log
          retention-days: 1
