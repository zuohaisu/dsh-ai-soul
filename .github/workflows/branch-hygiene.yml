name: Branch Hygiene

on:
  schedule:
    # Monday 02:00 UTC = Monday 10:00 China Standard Time.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report candidates without deleting branches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean stale branches safely
        uses: actions/github-script@v8
        env:
          STALE_DAYS: "7"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          script: |
            const staleDays = Number(process.env.STALE_DAYS || "7");
            const dryRun = process.env.DRY_RUN === "true";
            const cutoff = Date.now() - staleDays * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const staleUnmerged = [];
            const kept = [];
            let staleCandidates = 0;

            async function deleteBranch(name, reason) {
              if (dryRun) {
                kept.push([name, `safe to delete (${reason}); dry run`]);
                return;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push([name, reason]);
              } catch (error) {
                kept.push([name, `delete failed: ${error.message}`]);
              }
            }

            for (const branch of branches) {
              const name = branch.name;

              if (name === defaultBranch) {
                kept.push([name, "default branch"]);
                continue;
              }
              if (branch.protected) {
                kept.push([name, "protected branch"]);
                continue;
              }

              // Git has no reliable branch created_at. Staleness therefore means
              // that the branch HEAD has had no commit activity for STALE_DAYS.
              let headCommit;
              try {
                const response = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: branch.commit.sha,
                });
                headCommit = response.data;
              } catch (error) {
                kept.push([name, `cannot inspect HEAD commit: ${error.message}`]);
                continue;
              }

              const lastActivity =
                headCommit.commit?.committer?.date || headCommit.commit?.author?.date;
              const lastActivityMs = lastActivity ? new Date(lastActivity).getTime() : NaN;
              if (!Number.isFinite(lastActivityMs)) {
                kept.push([name, "HEAD commit has no valid timestamp"]);
                continue;
              }
              if (lastActivityMs > cutoff) {
                kept.push([name, `active within ${staleDays} days (${lastActivity})`]);
                continue;
              }
              staleCandidates += 1;

              // Open work always wins over cleanup.
              let openPRs;
              try {
                openPRs = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "open",
                  head: `${owner}:${name}`,
                  per_page: 100,
                });
              } catch (error) {
                kept.push([name, `cannot inspect open PRs: ${error.message}`]);
                continue;
              }
              if (openPRs.length) {
                kept.push([
                  name,
                  `stale but has open PR: ${openPRs.map(pr => `#${pr.number}`).join(", ")}`,
                ]);
                continue;
              }

              // First proof: every branch commit is already reachable from main.
              let compare;
              try {
                compare = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${defaultBranch}...${name}`,
                });
              } catch (error) {
                kept.push([name, `cannot compare with ${defaultBranch}: ${error.message}`]);
                continue;
              }

              if (compare.data.ahead_by === 0) {
                await deleteBranch(name, `fully reachable from ${defaultBranch}`);
                continue;
              }

              // Second proof: a PR whose head is exactly this branch was merged
              // into the current default branch. This covers squash/rebase merges,
              // where the original branch commit SHAs are not reachable from main.
              // We intentionally do not treat merely CLOSED PRs as deletion proof.
              let historicalPRs;
              try {
                historicalPRs = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "closed",
                  head: `${owner}:${name}`,
                  base: defaultBranch,
                  sort: "updated",
                  direction: "desc",
                  per_page: 100,
                });
              } catch (error) {
                kept.push([name, `cannot inspect historical PRs: ${error.message}`]);
                continue;
              }

              const mergedPRs = historicalPRs.filter(pr => pr.merged_at);
              if (mergedPRs.length) {
                const pr = mergedPRs[0];
                await deleteBranch(
                  name,
                  `merged PR #${pr.number} into ${defaultBranch} at ${pr.merged_at}`,
                );
                continue;
              }

              staleUnmerged.push([
                name,
                `${compare.data.ahead_by} commit(s) not in ${defaultBranch}; no merged PR evidence; last activity ${lastActivity}`,
              ]);
            }

            const summary = core.summary
              .addHeading("Branch Hygiene")
              .addRaw(`Repository: ${owner}/${repo}\n\n`)
              .addRaw(`Policy: HEAD inactive for at least ${staleDays} days; fail closed.\n\n`)
              .addRaw(`Deletion proofs: fully reachable from ${defaultBranch}, or merged PR into ${defaultBranch}.\n\n`)
              .addRaw(`Dry run: ${dryRun}\n\n`)
              .addRaw(`Stale candidates: ${staleCandidates}\n\n`)
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addTable([
                [{ data: "Deleted branch", header: true }, { data: "Evidence", header: true }],
                ...(deleted.length ? deleted : [["None", "-"]]),
              ])
              .addHeading("Stale but unmerged", 2)
              .addTable([
                [{ data: "Branch", header: true }, { data: "Reason", header: true }],
                ...(staleUnmerged.length ? staleUnmerged : [["None", "-"]]),
              ])
              .addHeading("Kept", 2)
              .addTable([
                [{ data: "Branch", header: true }, { data: "Reason", header: true }],
                ...(kept.length ? kept : [["None", "-"]]),
              ]);

            await summary.write();
            core.info(
              `Stale ${staleCandidates}; deleted ${deleted.length}; ` +
              `stale-unmerged ${staleUnmerged.length}; kept ${kept.length}.`
            );
