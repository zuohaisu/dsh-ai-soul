name: Branch Hygiene

on:
  schedule:
    # Monday 02:00 UTC = Monday 10:00 China Standard Time.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report candidates without deleting branches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean stale branches safely
        uses: actions/github-script@v8
        env:
          STALE_DAYS: "7"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          script: |
            const staleDays = Number(process.env.STALE_DAYS || "7");
            const dryRun = process.env.DRY_RUN === "true";
            const cutoff = Date.now() - staleDays * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const staleUnmerged = [];
            const kept = [];
            let staleCandidates = 0;

            for (const branch of branches) {
              const name = branch.name;

              if (name === defaultBranch) {
                kept.push([name, "default branch"]);
                continue;
              }
              if (branch.protected) {
                kept.push([name, "protected branch"]);
                continue;
              }

              // Branches do not have a reliable created_at timestamp in Git.
              // Define staleness by the HEAD commit's last activity instead.
              let headCommit;
              try {
                const response = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: branch.commit.sha,
                });
                headCommit = response.data;
              } catch (error) {
                kept.push([name, `cannot inspect HEAD commit: ${error.message}`]);
                continue;
              }

              const lastActivity =
                headCommit.commit?.committer?.date || headCommit.commit?.author?.date;
              if (!lastActivity) {
                kept.push([name, "HEAD commit has no usable timestamp"]);
                continue;
              }

              const lastActivityMs = new Date(lastActivity).getTime();
              if (!Number.isFinite(lastActivityMs)) {
                kept.push([name, `invalid HEAD timestamp: ${lastActivity}`]);
                continue;
              }
              if (lastActivityMs > cutoff) {
                kept.push([name, `active within ${staleDays} days (${lastActivity})`]);
                continue;
              }
              staleCandidates += 1;

              const openPRs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                head: `${owner}:${name}`,
                per_page: 100,
              });
              if (openPRs.length) {
                kept.push([
                  name,
                  `stale but has open PR: ${openPRs.map(pr => `#${pr.number}`).join(", ")}`,
                ]);
                continue;
              }

              let compare;
              try {
                compare = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${defaultBranch}...${name}`,
                });
              } catch (error) {
                kept.push([name, `cannot compare with ${defaultBranch}: ${error.message}`]);
                continue;
              }

              if (compare.data.ahead_by !== 0) {
                staleUnmerged.push([
                  name,
                  `${compare.data.ahead_by} commit(s) not in ${defaultBranch}; last activity ${lastActivity}`,
                ]);
                continue;
              }

              if (dryRun) {
                kept.push([name, `safe to delete; dry run (${lastActivity})`]);
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                deleted.push(name);
              } catch (error) {
                kept.push([name, `delete failed: ${error.message}`]);
              }
            }

            const summary = core.summary
              .addHeading("Branch Hygiene")
              .addRaw(`Repository: ${owner}/${repo}\n\n`)
              .addRaw(`Policy: HEAD inactive for at least ${staleDays} days; fail closed.\n\n`)
              .addRaw(`Dry run: ${dryRun}\n\n`)
              .addRaw(`Stale candidates: ${staleCandidates}\n\n`)
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addList(deleted.length ? deleted : ["None"])
              .addHeading("Stale but unmerged", 2)
              .addTable([
                [{ data: "Branch", header: true }, { data: "Reason", header: true }],
                ...(staleUnmerged.length ? staleUnmerged : [["None", "-"]]),
              ])
              .addHeading("Kept", 2)
              .addTable([
                [{ data: "Branch", header: true }, { data: "Reason", header: true }],
                ...(kept.length ? kept : [["None", "-"]]),
              ]);

            await summary.write();
            core.info(
              `Stale ${staleCandidates}; deleted ${deleted.length}; ` +
              `stale-unmerged ${staleUnmerged.length}; kept ${kept.length}.`
            );
